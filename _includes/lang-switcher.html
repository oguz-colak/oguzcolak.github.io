{% if site.active_lang == "en" %}
<a href="/" id="lang-switch-link" hreflang="tr" aria-label="Türkçeye geç" class="lang-switcher__link">TR</a>
<script>
  (function() {
    var path = window.location.pathname.replace(/^\/en\b/, '') || '/';
    document.getElementById('lang-switch-link').href = path;
  })();
</script>
{% else %}
<a href="/en/" id="lang-switch-link" hreflang="en" aria-label="Switch to English" class="lang-switcher__link">EN</a>
<script>
  (function() {
    document.getElementById('lang-switch-link').href = '/en' + window.location.pathname;
  })();
</script>
{% endif %}
